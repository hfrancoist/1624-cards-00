<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- skull -->
  <ellipse cx="50" cy="42" rx="22" ry="20" fill="white"/>
  <!-- eyes -->
  <circle cx="43" cy="39" r="5" fill="#111"/>
  <circle cx="57" cy="39" r="5" fill="#111"/>
  <!-- nose -->
  <path d="M48,46 L52,46 L50,50 Z" fill="#111"/>
  <!-- teeth -->
  <rect x="43" y="57" width="5" height="7" rx="1" fill="white"/>
  <rect x="51" y="57" width="5" height="7" rx="1" fill="white"/>
  <!-- jaw -->
  <path d="M32,54 Q50,68 68,54" stroke="white" stroke-width="3" fill="none"/>
  <!-- crossbones -->
  <line x1="15" y1="75" x2="85" y2="85" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <line x1="85" y1="75" x2="15" y2="85" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- bone ends -->
  <circle cx="15" cy="75" r="5" fill="white"/>
  <circle cx="85" cy="85" r="5" fill="white"/>
  <circle cx="85" cy="75" r="5" fill="white"/>
  <circle cx="15" cy="85" r="5" fill="white"/>
</svg>
